name: ketoclub
description: "KetoClub: Restaurant menu analyzer for keto dieters. Classify dishes by keto-compatibility and generate waiter instructions for modifications. Web, iOS, and Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2
  # Must match `flutter-version` in .github/workflows/ci.yml (architecture.md §18.5).
  flutter: ">=3.47.4"

dependencies:
  # Reachability hint consulted by the classifier router before it spends an
  # LLM request (architecture.md §8, D10). A hint, never a verdict: a request
  # that fails anyway still maps to `offline`.
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: ^11.0.0
  # Menu and analysis cache (architecture.md §6.4). Pure Dart; only di.dart
  # touches hive_flutter, so the cache is testable without a binding.
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.1.0
  intl: ^0.20.3
  provider: ^6.0.0
  # Raises screen brightness while the Waiter Card is open so a waiter can read
  # it across a table; restored on close, and a no-op on web.
  screen_brightness: ^2.1.11
  # Non-secret settings: filters, language, consent, last venue.
  shared_preferences: ^2.5.5
  # Opens the venue on its source platform.
  url_launcher: ^6.3.2

dev_dependencies:
  # Controls time where a timeout is under test (architecture.md §18.4).
  fake_async: ^1.3.3
  # Generates the launcher icon set below from assets/icon/ (issue #66).
  # `dart run flutter_launcher_icons` regenerates its committed output.
  flutter_launcher_icons: ^0.14.4
  # Generates the native splash screens below from assets/splash/ (issue
  # #66). `dart run flutter_native_splash:create` regenerates its committed
  # output; `dart run flutter_native_splash:remove` reverts it.
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Third-party types only, never an interface this project defines
  # (architecture.md §18.4).
  mockito: ^5.8.1
  # Lint set used by analysis_options.yaml (architecture.md §18.3).
  very_good_analysis: ^11.0.0

flutter:
  # Required by `flutter gen-l10n` (architecture.md §12); the generated output
  # is committed under lib/l10n/generated/ per l10n.yaml.
  generate: true
  uses-material-design: true

  # The licence text for the bundled families, registered with
  # LicenseRegistry at startup so `showLicensePage` credits them.
  assets:
    - assets/fonts/OFL-PublicSans.txt
    - assets/fonts/OFL-InstrumentSerif.txt

  # The two families the .design artboards call for. Both are SIL OFL 1.1;
  # the licence text sits beside the files in assets/fonts/.
  #
  # Neither family carries Hebrew glyphs, and this app is bilingual (D7), so
  # the theme must set a fontFamilyFallback that reaches a Hebrew-capable
  # system face. Do not set either family as a bare default.
  fonts:
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans-400.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-500.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-600.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-700.ttf
          weight: 700
        - asset: assets/fonts/PublicSans-800.ttf
          weight: 800
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-400.ttf
          weight: 400

# Launcher icon set (issue #66), generated by `flutter_launcher_icons` from
# assets/icon/ — see tool/generate_brand_assets.py for how those source
# images were drawn (a leaf mark in the theme's accent colours; there is no
# separate design asset to import). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  # Android 8+ adaptive icon: a solid accent-green background (AppTokens
  # .lightAccent) behind the same mark, redrawn without a background so it
  # can be masked into circle/squircle/etc. shapes.
  adaptive_icon_background: "#3C7847"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#3C7847"
    theme_color: "#3C7847"
  min_sdk_android: 21

# Native splash screen (issue #66), matching AppTokens.lightBg/darkBg and
# the accent-coloured leaf mark. Regenerate with:
#   dart run flutter_native_splash:create
# (`dart run flutter_native_splash:remove` reverts the native platform
# files this writes).
flutter_native_splash:
  color: "#FAF7F0"
  image: assets/splash/branding_light.png
  color_dark: "#14120E"
  image_dark: assets/splash/branding_dark.png
  android_12:
    color: "#FAF7F0"
    image: assets/splash/branding_light.png
    color_dark: "#14120E"
    image_dark: assets/splash/branding_dark.png
  web: false
