<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }
    .app { --bg: #faf7f0; --surface: #ffffff; --surface2: #f4efe4; --ink: #1f1c17; --ink2: #6f675b; --ink3: #a09484;
      --line: rgba(31,28,23,0.11); --line2: rgba(31,28,23,0.07);
      --accent: oklch(0.52 0.10 148); --accent-hover: oklch(0.42 0.10 148); --accent-ink: #faf7f0;
      --green: oklch(0.56 0.13 148); --green-tint: oklch(0.965 0.022 152); --green-ink: oklch(0.40 0.10 150); --green-on: #faf7f0;
      --amber: oklch(0.75 0.14 74); --amber-tint: oklch(0.965 0.032 85); --amber-ink: oklch(0.44 0.10 66); --amber-on: #2a1e08;
      --red: oklch(0.56 0.17 27); --red-tint: oklch(0.965 0.020 25); --red-ink: oklch(0.47 0.14 27); --red-on: #faf7f0;
      --shadow: 0 20px 44px -20px rgba(31,28,23,0.40);
      --photo: linear-gradient(135deg, #e9e1cf 0%, #d8cbb0 100%); --photo-ink: #8b7d63; }
    .app.dark { --bg: #14120e; --surface: #1e1b15; --surface2: #272218; --ink: #f5f0e4; --ink2: #a99e8c; --ink3: #7d7364;
      --line: rgba(245,240,228,0.12); --line2: rgba(245,240,228,0.07);
      --accent: oklch(0.74 0.13 148); --accent-hover: oklch(0.82 0.12 148); --accent-ink: #14120e;
      --green: oklch(0.76 0.14 148); --green-tint: oklch(0.30 0.055 150); --green-ink: oklch(0.85 0.13 150); --green-on: #0f1710;
      --amber: oklch(0.81 0.13 78); --amber-tint: oklch(0.31 0.05 72); --amber-ink: oklch(0.89 0.11 82); --amber-on: #1c1406;
      --red: oklch(0.66 0.17 27); --red-tint: oklch(0.29 0.065 25); --red-ink: oklch(0.78 0.14 27); --red-on: #170c0a;
      --shadow: 0 20px 44px -20px rgba(0,0,0,0.85);
      --photo: linear-gradient(135deg, #322c22 0%, #1c180f 100%); --photo-ink: #6b6152; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; user-select: none; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 4px 7px; border-radius: 8px; font-size: 10px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; }
    .ph { position: relative; display: flex; align-items: center; justify-content: center; background: var(--photo); }
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-weight: 400; }
    .nav { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav span { font-size: 10px; font-weight: 700; }
  </style>
</helmet>

<div class="app {{themeClass}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 16px 20px; flex-shrink: 0;">
    <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink3);">Show this to your server</div>
    <div style="width: 32px; height: 32px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 20px 18px 20px; flex-shrink: 0;">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="2">
      <div style="flex-grow: 1; flex-basis: 0; padding: 9px 10px; border-radius: 11px; cursor: pointer; user-select: none; text-align: center; background: {{tab.bg}}; color: {{tab.fg}}; border: 1.5px solid {{tab.border}}; font-size: 12.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" onClick="{{tab.pick}}">{{tab.label}}</div>
    </sc-for>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 20px;">
    <div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 22px;">
      <div style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink3);">Ember &amp; Vine</div>
      <div class="serif" style="font-size: 34px; line-height: 1.1; color: var(--ink);">{{dishName}}</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <sc-for list="{{lines}}" as="line" hint-placeholder-count="2">
        <div style="display: flex; gap: 14px; align-items: flex-start; padding: 18px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--amber);">
          <div style="width: 30px; height: 30px; border-radius: 999px; flex-shrink: 0; background: var(--amber); color: var(--amber-on); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800;">{{line.n}}</div>
          <div style="flex-grow: 1; font-size: 21px; line-height: 1.38; font-weight: 500; color: var(--ink); text-wrap: pretty;">{{line.text}}</div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: var(--green-tint); border: 1px solid var(--green); display: flex; gap: 11px; align-items: flex-start;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--green-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="m5 13 4.5 4.5L19 7"/></svg>
      <div style="font-size: 14.5px; line-height: 1.45; color: var(--green-ink); font-weight: 600; text-wrap: pretty;">{{afterText}}</div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 16px 20px 22px 20px; background: var(--bg); display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 15px; border-radius: 14px; background: var(--ink); color: var(--bg); cursor: pointer; user-select: none;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg>
        <span style="font-size: 14.5px; font-weight: 700;">Copy text</span>
      </div>
      <div style="width: 54px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); cursor: pointer;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
      </div>
    </div>
    <div style="text-align: center; font-size: 11.5px; color: var(--ink3);">Screen brightness is raised while this card is open</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Dark","section":"Appearance"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 'seabass' };
  }

  renderVals() {
    const dark = (this.props.theme ?? 'Dark') === 'Dark';

    const cards = [
      { id: 'seabass', tab: 'Sea Bass', name: 'Sea Bass Fillet',
        lines: [
          'Please replace the potato purée with a green salad or extra steamed greens.',
          'No baby carrots, and olive oil and lemon on the side instead of the house dressing.'
        ],
        after: 'With these changes the dish is about 3g net carbs — safe to order.' },
      { id: 'chicken', tab: 'Chicken Thigh', name: 'Charcoal Chicken Thigh',
        lines: [
          'Please grill the chicken without the honey-teriyaki glaze — any sauce in a ramekin on the side.',
          'Swap the rice for a green salad or grilled vegetables.'
        ],
        after: 'With these changes the dish is about 4g net carbs — safe to order.' }
    ];

    const a = this.state.active;
    const card = cards.find((c) => c.id === a) || cards[0];

    return {
      themeClass: dark ? 'dark' : 'light',
      dishName: card.name,
      afterText: card.after,
      lines: card.lines.map((text, i) => ({ n: i + 1, text: text })),
      tabs: cards.map((c) => ({
        label: c.tab,
        bg: c.id === a ? 'var(--ink)' : 'var(--surface)',
        fg: c.id === a ? 'var(--bg)' : 'var(--ink2)',
        border: c.id === a ? 'var(--ink)' : 'var(--line)',
        pick: () => this.setState({ active: c.id })
      }))
    };
  }
}
</script>
</body>
</html>
