# KetoClub continuous integration.
#
# Every job here is a required status check on pull requests (see
# architecture.md §18.5). Green since the first skeleton (build-order step 1);
# a red main is the top priority for whoever broke it.
#
# The Flutter version is pinned below and must equal environment.flutter in
# pubspec.yaml; bump both in one commit.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A superseded run is cancelled on a branch, never on main: every commit that
  # lands there keeps a complete result (issue #290).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Run the backend gate
        run: backend/check.sh

  quality:
    name: Format and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep equal to environment.flutter in pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Check every flow test lands in exactly one integration shard
        run: tool/flow_shard.sh --verify 4
      - name: Analyze (infos and warnings are fatal)
        run: flutter analyze --fatal-infos --fatal-warnings

  test:
    name: Unit and architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep equal to environment.flutter in pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Generate the all-imports helper so untested files count as zero coverage
        run: tool/gen_coverage_helper.sh
      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded
      - name: Enforce the coverage gate
        run: tool/coverage_gate.sh coverage/lcov.info
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  # The flow tests, split across parallel machines (issue #453). Each shard
  # drives one generated entry (tool/flow_shard.sh) that imports its share of
  # integration_test/flows/*_flow_test.dart, so a machine compiles the app for
  # the web once and starts Chrome once. Driving every file on its own cost
  # about 50 s a file, 3 s of it testing: 28 minutes for 33 files.
  #
  # Past about four shards a machine's fixed cost (checkout, Flutter, pub get,
  # one compile: ~2.5 minutes) is all that is left, so more buy nothing. Keep
  # FLOW_SHARDS, the matrix and the quality job's --verify count equal.
  integration-shard:
    name: Integration tests, shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      FLOW_SHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep equal to environment.flutter in pubspec.yaml
          cache: true
      # Use the runner image's own Chrome and the ChromeDriver built for it.
      # Installing a second browser is what used to break this job: ChromeDriver
      # launches whatever Chrome sits on the default path, not the binary an
      # action downloaded into the tool cache, so a driver from one release tried
      # to drive the image's Chrome from another and refused the session. The
      # image keeps its pair in step, which removes the drift at its source.
      - name: Resolve ChromeDriver and check it matches the browser
        run: |
          set -euo pipefail
          driver="${CHROMEWEBDRIVER:-}/chromedriver"
          if [ ! -x "$driver" ]; then
            driver="$(command -v chromedriver)"
          fi
          google-chrome --version
          "$driver" --version
          chrome_major="$(google-chrome --version | grep -oE '[0-9]+' | head -1)"
          driver_major="$("$driver" --version | grep -oE '[0-9]+' | head -1)"
          if [ "$chrome_major" != "$driver_major" ]; then
            echo "Chrome $chrome_major and ChromeDriver $driver_major disagree;" \
                 "the runner image shipped an unmatched pair." >&2
            exit 1
          fi
          echo "CHROMEDRIVER=$driver" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Start chromedriver
        run: |
          "$CHROMEDRIVER" --port=4444 &
          sleep 2
      - name: Write this shard's entry
        run: |
          set -euo pipefail
          tool/flow_shard.sh --verify "$FLOW_SHARDS"
          echo "ENTRY=$(tool/flow_shard.sh ${{ matrix.shard }} "$FLOW_SHARDS")" >> "$GITHUB_ENV"
      - name: Drive this shard's flows on web-server
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target="$ENTRY" \
            -d web-server \
            --browser-name=chrome \
            --headless

  # One stable check for the shards above: green only when every shard is.
  # Reviewers, and any branch rule, look for this name.
  integration:
    name: Integration tests (headless Chrome)
    runs-on: ubuntu-latest
    needs: integration-shard
    if: always()
    steps:
      - name: Every shard passed
        run: |
          result="${{ needs.integration-shard.result }}"
          echo "integration shards: $result"
          [ "$result" = "success" ]

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [web, apk, apk-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        if: startsWith(matrix.target, 'apk')
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep equal to environment.flutter in pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Build web
        if: matrix.target == 'web'
        run: flutter build web --release
      - name: Build Android (debug)
        if: matrix.target == 'apk'
        run: flutter build apk --debug
      # Release mode runs R8 shrinking, which the debug build never does; it
      # signs with the debug key unless a release config exists (issue #290).
      - name: Build Android (release)
        if: matrix.target == 'apk-release'
        run: flutter build apk --release

  ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep equal to environment.flutter in pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
