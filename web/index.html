<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KetoClub: restaurant menu analyzer for keto dieters. Classify dishes by keto-compatibility and generate waiter instructions for modifications.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KetoClub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KetoClub</title>
  <link rel="manifest" href="manifest.json">

  <!-- Browser chrome follows the same --bg as the splash and the manifest
       (AppTokens.lightBg / darkBg; test/web_shell_test.dart pins them). -->
  <meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14120E" media="(prefers-color-scheme: dark)">
  <style>
    /* The loading splash (issue #226): without it a first visit is a blank
       page until CanvasKit arrives. Removed on Flutter's first frame. */
    html, body { margin: 0; height: 100%; background: #FAF7F0; }
    #splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #FAF7F0; color: #3C7847;
      font: 600 28px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.01em;
    }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #14120E; }
      #splash { color: #6DC17B; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">KetoClub</div>
  <script>
    // Flutter dispatches `flutter-first-frame` on window once it has painted.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
